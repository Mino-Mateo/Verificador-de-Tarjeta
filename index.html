<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificador de tarjeta</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    input { font: inherit; padding: 0.5rem; width: 100%; box-sizing: border-box; }
    button { font: inherit; padding: 0.5rem 1rem; margin-top: 0.5rem; }
    .ok { color: #0a7a2f; } .err { color: #b00020; }
    .luhn { display: flex; flex-wrap: wrap; gap: 0.25rem; font-family: monospace; margin-top: 1rem; }
    .luhn span { border: 1px solid #ccc; padding: 0.25rem 0.4rem; text-align: center; }
    .luhn .dup { background: #f1e3fa; border-color: #983ad6; }
  </style>
</head>
<body>
  <h1>Verificador de tarjeta</h1>
  <p>Usa números de prueba (por ejemplo 4242 4242 4242 4242). Nada sale de tu navegador.</p>
  <form id="f">
    <label for="n">Número de tarjeta</label>
    <input id="n" inputmode="numeric" autocomplete="off" placeholder="4242 4242 4242 4242" />
    <button>Verificar</button>
  </form>
  <p id="r" role="status"></p>
  <div id="luhn" class="luhn"></div>
  <script type="module">
    import { validarTarjeta } from "./dist/tarjeta.js";
    const out = document.getElementById("r");
    const luhn = document.getElementById("luhn");
    document.getElementById("f").addEventListener("submit", (e) => {
      e.preventDefault();
      const r = validarTarjeta(document.getElementById("n").value);
      out.textContent = r.mensaje + (r.suma !== null ? ` · suma Luhn ${r.suma}` : "");
      out.className = r.valido ? "ok" : "err";
      luhn.replaceChildren(...r.pasos.map((p) => {
        const s = document.createElement("span");
        s.textContent = p.duplicado ? `${p.digito}→${p.valor}` : String(p.valor);
        if (p.duplicado) s.className = "dup";
        return s;
      }));
    });
  </script>
</body>
</html>
